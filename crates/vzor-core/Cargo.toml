[package]
name = "vzor-core"
version = "0.3.2"
edition = "2021"
license = "MIT"
description = "Rust core for the vzor Python library"

[lib]
name = "_vzor_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
