[build-system]
requires = ["maturin>=1.9.3,<2"]
build-backend = "maturin"

[project]
name = "vzor"
version = "0.4.2"
description = "Rust-powered data quality library for Python"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "THIRD_PARTY_LICENSES/Apache-2.0-with-LLVM-exception.txt",
]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
dependencies = ["pandas>=2.2.3,<4"]

[project.optional-dependencies]
polars = ["polars>=1.0,<2"]

[project.scripts]
vzor = "vzor.cli:main"

[project.urls]
Repository = "https://github.com/fernandougomezs2/Vzor"
Issues = "https://github.com/fernandougomezs2/Vzor/issues"
Documentation = "https://github.com/fernandougomezs2/Vzor#readme"
Changelog = "https://github.com/fernandougomezs2/Vzor/blob/main/CHANGELOG.md"

[tool.maturin]
bindings = "pyo3"
manifest-path = "crates/vzor-core/Cargo.toml"
python-source = "python"
module-name = "vzor._vzor_core"
